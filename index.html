<!doctype html>
<html lang="uz" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#016b7b" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/golos-text-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="/brand-logo.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>Sanoat xavfsizligi ekotizimi</title>
    <style>
      /* Applied before globals.css arrives, otherwise the browser default body
         margin makes the 100vh splash overflow and flashes a scrollbar. */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #app-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        background: #ffffff;
      }
      #app-boot img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: contain;
      }
      #app-boot .track {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(1, 107, 123, 0.15);
      }
      #app-boot .bar {
        width: 100%;
        height: 100%;
        background: #016b7b;
        transform-origin: left;
        animation: app-boot-progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-boot-progress {
        0% {
          transform: scaleX(0);
          opacity: 1;
        }
        60% {
          transform: scaleX(0.75);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .bar {
          animation: none;
        }
      }
    </style>
    <script>
      /* A shell cached by an older service worker can point at asset hashes a
         deploy has since removed. Nothing in the bundle can recover from that,
         because none of it ever runs - so the escape hatch lives in the document.
         Guarded per tab session, so it can clear and reload at most once. */
      ;(function () {
        var KEY = 'shell-recovery'
        var running = false

        function recover() {
          if (running) return
          try {
            if (sessionStorage.getItem(KEY)) return
            sessionStorage.setItem(KEY, '1')
          } catch (e) {
            /* Private mode: the guard just does not persist. */
          }
          running = true

          var caches$ = window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key)
                  })
                )
              })
            : Promise.resolve()

          var workers$ = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (list) {
                return Promise.all(
                  list.map(function (registration) {
                    return registration.unregister()
                  })
                )
              })
            : Promise.resolve()

          Promise.all([caches$, workers$])
            .catch(function () {})
            .then(function () {
              location.reload()
            })
        }

        addEventListener(
          'error',
          function (event) {
            var node = event.target
            if (node && node.tagName === 'SCRIPT' && String(node.src).indexOf('/assets/') !== -1) recover()
          },
          true
        )

        /* The entry can also load and then throw, which fires no resource error.
           A splash still on screen well past any reasonable load means the same. */
        addEventListener('load', function () {
          setTimeout(function () {
            if (document.getElementById('app-boot')) recover()
          }, 12000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <img src="/brand-logo.webp" alt="Sanoat xavfsizligi ekotizimi" width="96" height="96" />
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <div id="alert"></div>
    <noscript>
      <p style="padding: 24px; text-align: center; font-family: sans-serif">
        Tizimdan foydalanish uchun brauzeringizda JavaScript yoqilgan bo‘lishi kerak.
      </p>
    </noscript>
    <script src="/src/app/main.tsx" type="module"></script>
  </body>
</html>
