<!doctype html>
<html lang="uz" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#016b7b" />
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/brand-logo.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>Sanoat xavfsizligi ekotizimi</title>
    <style>
      #app-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 100%;
        min-height: 100vh;
        background: #ffffff;
      }
      #app-boot img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: contain;
      }
      #app-boot .track {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(1, 107, 123, 0.15);
      }
      #app-boot .bar {
        width: 100%;
        height: 100%;
        background: #016b7b;
        transform-origin: left;
        animation: app-boot-progress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-boot-progress {
        0% {
          transform: scaleX(0);
          opacity: 1;
        }
        60% {
          transform: scaleX(0.75);
          opacity: 1;
        }
        100% {
          transform: scaleX(1);
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <img src="/brand-logo.webp" alt="Sanoat xavfsizligi ekotizimi" width="96" height="96" />
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <div id="alert"></div>
    <noscript>
      <p style="padding: 24px; text-align: center; font-family: sans-serif">
        Tizimdan foydalanish uchun brauzeringizda JavaScript yoqilgan bo‘lishi kerak.
      </p>
    </noscript>
    <script src="/src/app/main.tsx" type="module"></script>
  </body>
</html>
